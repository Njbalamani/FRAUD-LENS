{% extends "base.html" %}
{% block title %}{{ page_title }} · FraudLens{% endblock %}
{% block content %}
  <section class="error-page">
    <span class="error-code">403</span>
    <h1>Access denied</h1>
    <p>Your current role does not have permission to view this area.</p>
    <div class="error-actions">
      <a class="ghost-button" href="{% url 'dashboard' %}">Back to overview</a>
      {% if not user.is_authenticated %}<a class="primary-button" href="{% url 'login' %}">Sign in</a>{% endif %}
    </div>
  </section>
{% endblock %}
