{% extends "base.html" %}
{% block title %}{{ page_title }} · FraudLens{% endblock %}
{% block content %}
  <section class="error-page">
    <span class="error-code">500</span>
    <h1>Something went wrong</h1>
    <p>The server could not complete this request. Please try again or contact an administrator.</p>
    <div class="error-actions">
      <a class="ghost-button" href="{% url 'dashboard' %}">Back to overview</a>
      <a class="primary-button" href="{% url 'health' %}">Check system health</a>
    </div>
  </section>
{% endblock %}
